# Neo4j Configuration for CPG Pipeline

# Bolt and HTTP connectors
server.bolt.enabled=true
server.bolt.listen_address=:7687
server.http.enabled=true
server.http.listen_address=:7474

# Memory settings
server.memory.heap.initial_size=2g
server.memory.heap.max_size=4g
server.memory.pagecache.size=2g

# Transaction limits
db.memory.transaction.total.max=2g

# APOC configuration
dbms.security.procedures.unrestricted=apoc.*,gds.*
dbms.security.procedures.allowlist=apoc.*,gds.*

# APOC import settings (for JSON/CSV imports)
apoc.import.file.enabled=true
apoc.export.file.enabled=true

# Network settings
server.default_listen_address=0.0.0.0
server.default_advertised_address=34.28.0.180

# Logging
server.directories.logs=/logs

# Disable strict validation
server.config.strict_validation.enabled=false

# ========================================
# PHASE 1 PERFORMANCE OPTIMIZATIONS
# ========================================

# Disable transaction logs (safe for ephemeral conversion data)
db.tx_log.rotation.retention_policy=false

# Unlimited I/O for checkpoints
db.checkpoint.iops.limit=-1

# Disable query logging during imports
db.logs.query.enabled=OFF

# Optimize Bolt threading for concurrent writes
server.bolt.thread_pool_max_size=400
server.bolt.thread_pool_min_size=100
